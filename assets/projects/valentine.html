<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #fff0f3;
            overflow: hidden;
            position: relative;
        }

        #question-container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-bottom: 50px;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            height: 100px;
            width: 400px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            animation: heartbeat 1.2s infinite;
        }

        #noBtn {
            background-color: #8d99ae;
            color: white;
            position: relative; /* Starts relative to keep it in line */
            z-index: 999;
            transition: 0.1s ease;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        #content {
            display: none;
            text-align: center;
            z-index: 20;
            animation: fadeIn 1.5s ease-out;
        }

        #content img {
            max-width: 90%;
            max-height: 400px;
            border-radius: 20px;
            border: 8px solid white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            top: -10%;
            color: #ffb3c1;
            font-size: 20px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="question-container">
        <h1>Do you want to be my Valentine?</h1>
        <div class="buttons-wrapper">
            <button id="yesBtn" onclick="showLove()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <div id="content">
        <h1>I knew you'd say Yes! ❤️</h1>
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1000&auto=format&fit=crop" alt="Us">
    </div>

    <script>
        // Floating hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 300);

        function moveButton() {
            const btn = document.getElementById('noBtn');
            
            // Switch to absolute immediately on first hover
            btn.style.position = 'absolute';

            // Calculate padding so it stays away from the screen edges
            const padding = 50;
            const maxWidth = window.innerWidth - btn.offsetWidth - padding;
            const maxHeight = window.innerHeight - btn.offsetHeight - padding;

            // Generate new coordinates
            const randomX = Math.max(padding, Math.floor(Math.random() * maxWidth));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxHeight));

            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function showLove() {
            document.getElementById('question-container').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
    </script>
</body>
</html>
