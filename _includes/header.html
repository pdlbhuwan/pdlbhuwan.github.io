<header class="site-header">
    <div class="container">
        <a href="/" class="logo">{{ site.title }}</a>

        <nav>
            <ul class="nav-menu">
                {% for item in site.nav_items %}

                {% endfor %}
            </ul>
        </nav>
    </div>
</header>
